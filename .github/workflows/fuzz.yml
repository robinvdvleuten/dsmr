name: Fuzz

on: 
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  fuzz-parse:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: jidicula/go-fuzz-action@23f1a5dd8444188fc547d3143a70e1261ff7fce6
        with:
          packages: ./
          fuzz-time: 30s
          fuzz-regexp: FuzzParse$
          fuzz-minimize-time: 1m
          go-version: "1.25"
  fuzz-parse-object:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: jidicula/go-fuzz-action@23f1a5dd8444188fc547d3143a70e1261ff7fce6
        with:
          packages: ./
          fuzz-time: 30s
          fuzz-regexp: FuzzParseObject$
          fuzz-minimize-time: 1m
          go-version: "1.25"
