name: Fuzz

on: 
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  fuzz-parse:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: jidicula/go-fuzz-action@ca499a56cc3e3aa7c221d30d8b525cfc6b52f185
        with:
          packages: ./
          fuzz-time: 30s
          fuzz-regexp: FuzzParse$
          fuzz-minimize-time: 1m
          go-version: "1.25"
  fuzz-parse-object:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: jidicula/go-fuzz-action@ca499a56cc3e3aa7c221d30d8b525cfc6b52f185
        with:
          packages: ./
          fuzz-time: 30s
          fuzz-regexp: FuzzParseObject$
          fuzz-minimize-time: 1m
          go-version: "1.25"
